name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
  # @divya2424/basketline-kafka and -sdk come from GitHub Packages. Each package grants
  # this repo read access (package settings → Manage Actions access).
  packages: read
jobs:
  # The web app: the simulated marketplaces' storefront (Basketline itself is API only).
  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [retailer-sim/storefront]
    steps:
      - uses: actions/checkout@v4
      # pnpm, at the version package.json's packageManager pins.
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@divya2424'
      # One workspace for the repo, installed from the root.
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm test
        working-directory: ${{ matrix.app }}
      # Lints first (prebuild).
      - run: pnpm build
        working-directory: ${{ matrix.app }}

  # Basketline's services, then the simulated retailer's: lint, typecheck, unit
  # and integration tests (and Basketline's architecture check, which covers both).
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@divya2424'
      # The integration tests use these, on the ports docker-compose.yml publishes.
      - run: docker compose up -d --wait postgres kafka clickhouse
        working-directory: basketline
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm verify
        working-directory: basketline
      - run: pnpm verify
        working-directory: retailer-sim

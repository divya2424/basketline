# The official Apache Airflow chart (https://airflow.apache.org/docs/helm-chart/)
# with the image from `docker compose build airflow`: the DAGs and jobs are baked in.
# Every component and task pod uses it.
airflowVersion: "3.3.2"
defaultAirflowRepository: ecommerce-analytics-airflow
defaultAirflowTag: latest

# Each task runs in its own pod, so nothing but the scheduler and API server
# runs between the nightly jobs.
executor: KubernetesExecutor
# No deferrable tasks, so no triggerer; no StatsD exporter.
triggerer:
  enabled: false
statsd:
  enabled: false

# The Postgres from infra/postgres/init.sql (airflow_db), not one the chart installs.
postgresql:
  enabled: false
data:
  metadataConnection:
    user: airflow_svc
    pass: airflow_svc_dev
    protocol: postgresql
    host: postgres
    port: 5432
    db: airflow_db
    sslmode: disable

# For the export job (airflow/jobs/export_archive.py); the task pods get them too.
# The docker-compose development credentials. On AWS: the Glue catalog
# (PYICEBERG_CATALOG__ARCHIVE__TYPE=glue, no S3 endpoint or keys) and an IAM
# role for the service account instead of keys (airflow/README.md).
env:
  - { name: CLICKHOUSE_URL, value: "http://ecommerce_analytics:ecommerce_analytics_dev@clickhouse:8123/analytics" }
  - { name: PYICEBERG_CATALOG__ARCHIVE__TYPE, value: sql }
  - { name: PYICEBERG_CATALOG__ARCHIVE__URI, value: "postgresql+psycopg2://iceberg_svc:iceberg_svc_dev@postgres:5432/iceberg_catalog_db" }
  - { name: PYICEBERG_CATALOG__ARCHIVE__WAREHOUSE, value: "s3://ad-insights-archive" }
  - { name: PYICEBERG_CATALOG__ARCHIVE__S3__ENDPOINT, value: "http://archive-storage:8333" }
  - { name: PYICEBERG_CATALOG__ARCHIVE__S3__REGION, value: us-east-1 }
  - { name: PYICEBERG_CATALOG__ARCHIVE__S3__ACCESS_KEY_ID, value: archive }
  - { name: PYICEBERG_CATALOG__ARCHIVE__S3__SECRET_ACCESS_KEY, value: archive_dev }
  # The history backfill: the warehouse's HTTP URL as ClickHouse reaches it (icebergS3).
  # On AWS: https://<bucket>.s3.<region>.amazonaws.com
  - { name: ARCHIVE_S3_URL, value: "http://archive-storage:8333/ad-insights-archive" }

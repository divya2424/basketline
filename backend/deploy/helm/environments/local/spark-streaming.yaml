# Images from `docker compose build` (backend/), loaded into the local cluster.
image:
  repository: ecommerce-analytics-spark-streaming
  tag: latest
# The docker-compose development credentials.
secrets:
  CLICKHOUSE_PASSWORD: ecommerce_analytics_dev
persistence:
  size: 1Gi
resources:
  requests:
    cpu: 500m
    memory: 1Gi

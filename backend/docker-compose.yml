name: basketline

x-service-env: &service-env
  NODE_ENV: production
  KAFKA_BROKERS: kafka:19092
  JWT_PUBLIC_KEY_FILE: /run/keys/jwt-public.pem
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by services (see platform/kafka.ts).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.44
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: basketline
      CLICKHOUSE_PASSWORD: basketline_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # The cold volume of the raw tables (infra/clickhouse/config/storage.xml).
      CLICKHOUSE_COLD_S3_ENDPOINT: http://archive-storage:8333/ad-insights-archive/clickhouse-cold/
      CLICKHOUSE_COLD_S3_ACCESS_KEY_ID: archive
      CLICKHOUSE_COLD_S3_SECRET_ACCESS_KEY: archive_dev
      CLICKHOUSE_COLD_S3_USE_ENV_CREDENTIALS: "false"
    ports: ["8123:8123"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    volumes:
      # Tables, then materialized views, then the Kafka tables for the Flink job's
      # serving topics: the files run in name order, on a new volume only.
      - ./infra/clickhouse:/docker-entrypoint-initdb.d:ro
      - ./infra/clickhouse/config/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user basketline --password basketline_dev --query 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

  auth-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: auth-service }, secrets: [npm_token] }
    # > SHUTDOWN_DRAIN_MS (5s) + SHUTDOWN_TIMEOUT_MS (25s), so Docker doesn't SIGKILL mid-shutdown.
    stop_grace_period: 35s
    environment:
      <<: *service-env
      PORT: 4001
      DATABASE_URL: postgres://identity_svc:identity_svc_dev@postgres:5432/identity_db
      JWT_PRIVATE_KEY_FILE: /run/keys/jwt-private.pem
    volumes: ["./keys:/run/keys:ro"]
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }

  product-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: product-service }, secrets: [npm_token] }
    # > SHUTDOWN_DRAIN_MS (5s) + SHUTDOWN_TIMEOUT_MS (25s), so Docker doesn't SIGKILL mid-shutdown.
    stop_grace_period: 35s
    environment:
      <<: *service-env
      PORT: 4002
      DATABASE_URL: postgres://product_svc:product_svc_dev@postgres:5432/product_db
    volumes: ["./keys:/run/keys:ro"]
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }

  campaign-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: campaign-service }, secrets: [npm_token] }
    # > SHUTDOWN_DRAIN_MS (5s) + SHUTDOWN_TIMEOUT_MS (25s), so Docker doesn't SIGKILL mid-shutdown.
    stop_grace_period: 35s
    environment:
      <<: *service-env
      PORT: 4003
      DATABASE_URL: postgres://campaign_svc:campaign_svc_dev@postgres:5432/campaign_db
    volumes: ["./keys:/run/keys:ro"]
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }

  analytics-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: analytics-service }, secrets: [npm_token] }
    # > SHUTDOWN_DRAIN_MS (5s) + SHUTDOWN_TIMEOUT_MS (25s), so Docker doesn't SIGKILL mid-shutdown.
    stop_grace_period: 35s
    environment:
      <<: *service-env
      PORT: 4004
      # No Postgres: events go to Kafka, metrics are read from ClickHouse.
      CLICKHOUSE_URL: http://basketline:basketline_dev@clickhouse:8123/analytics
    volumes: ["./keys:/run/keys:ro"]
    depends_on: { clickhouse: { condition: service_healthy }, kafka: { condition: service_healthy } }

  # Reads every analytics.<eventName>.v1 topic, credits basket additions to clicks,
  # and writes both to the serving topics ClickHouse loads (infra/clickhouse/03_kafka.sql).
  flink-streaming:
    build: { context: ./flink }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_GROUP_ID: events-to-clickhouse
      # Only when there is no checkpoint yet (flink/README.md).
      KAFKA_STARTUP_MODE: ${KAFKA_STARTUP_MODE:-earliest-offset}
      CHECKPOINT_DIR: /checkpoints
      # The Iceberg archive: the same catalog as airflow's PYICEBERG_CATALOG__ARCHIVE__*.
      ARCHIVE_JDBC_URI: jdbc:postgresql://postgres:5432/iceberg_catalog_db
      ARCHIVE_JDBC_USER: iceberg_svc
      ARCHIVE_JDBC_PASSWORD: iceberg_svc_dev
      ARCHIVE_S3_ENDPOINT: http://archive-storage:8333
      ARCHIVE_S3_ACCESS_KEY_ID: archive
      ARCHIVE_S3_SECRET_ACCESS_KEY: archive_dev
    # The Flink web UI: job graph, checkpoints, backpressure.
    ports: ["8081:8081"]
    volumes: ["flink-checkpoints:/checkpoints"]
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
      archive-storage: { condition: service_healthy }
      # It creates the analytics and serving topics.
      analytics-service: { condition: service_healthy }

  # S3 for the Iceberg archive locally (S3 itself on AWS). SeaweedFS, because
  # MinIO no longer publishes images. Its admin UI browses the bucket.
  archive-storage:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -bucket=ad-insights-archive
    environment:
      AWS_ACCESS_KEY_ID: archive
      AWS_SECRET_ACCESS_KEY: archive_dev
    ports: ["8333:8333", "23646:23646"]
    volumes: ["archive-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8333/"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Runs the batch jobs: the nightly Iceberg export (airflow/dags). UI at
  # http://localhost:8082, no login (local only).
  airflow:
    build: { context: ./airflow }
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_svc:airflow_svc_dev@postgres:5432/airflow_db
      # For the export job (airflow/jobs/export_archive.py).
      CLICKHOUSE_URL: http://basketline:basketline_dev@clickhouse:8123/analytics
      PYICEBERG_CATALOG__ARCHIVE__TYPE: sql
      PYICEBERG_CATALOG__ARCHIVE__URI: postgresql+psycopg2://iceberg_svc:iceberg_svc_dev@postgres:5432/iceberg_catalog_db
      PYICEBERG_CATALOG__ARCHIVE__WAREHOUSE: s3://ad-insights-archive
      PYICEBERG_CATALOG__ARCHIVE__S3__ENDPOINT: http://archive-storage:8333
      PYICEBERG_CATALOG__ARCHIVE__S3__REGION: us-east-1
      PYICEBERG_CATALOG__ARCHIVE__S3__ACCESS_KEY_ID: archive
      PYICEBERG_CATALOG__ARCHIVE__S3__SECRET_ACCESS_KEY: archive_dev
      # For the history backfill (airflow/jobs/backfill): the warehouse as ClickHouse
      # reaches it, to read the Spark job's output with icebergS3.
      ARCHIVE_S3_URL: http://archive-storage:8333/ad-insights-archive
    ports: ["127.0.0.1:8082:8080"]
    # Also baked into the image; mounted so edits apply without a rebuild. The
    # tests and the ClickHouse schema are for the backfill test, which runs here (it needs Java).
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/jobs:/opt/airflow/jobs:ro
      - ./airflow/tests:/opt/airflow/tests:ro
      - ./infra/clickhouse:/opt/airflow/clickhouse:ro
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      archive-storage: { condition: service_healthy }

  gateway:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: gateway }, secrets: [npm_token] }
    # > SHUTDOWN_DRAIN_MS (5s) + SHUTDOWN_TIMEOUT_MS (25s), so Docker doesn't SIGKILL mid-shutdown.
    stop_grace_period: 35s
    environment:
      <<: *service-env
      PORT: 8080
      DATABASE_URL: postgres://gateway_svc:gateway_svc_dev@postgres:5432/gateway_db
      AUTH_SERVICE_URL: http://auth-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
      CAMPAIGN_SERVICE_URL: http://campaign-service:4003
      ANALYTICS_SERVICE_URL: http://analytics-service:4004
      CORS_ORIGINS: http://localhost:5173
      # Per client IP. Raised only for load tests (loadtest/README.md).
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      EVENTS_RATE_LIMIT_PER_MINUTE: ${EVENTS_RATE_LIMIT_PER_MINUTE:-120}
      VISITOR_RATE_LIMIT_PER_MINUTE: ${VISITOR_RATE_LIMIT_PER_MINUTE:-10}
    ports: ["8080:8080"]
    volumes: ["./keys:/run/keys:ro"]
    depends_on:
      auth-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      campaign-service: { condition: service_healthy }
      analytics-service: { condition: service_healthy }

volumes:
  pgdata:
  chdata:
  flink-checkpoints:
  archive-data:

secrets:
  # Read access to GitHub Packages for @divya2424/basketline-kafka, used only while building images:
  # export NODE_AUTH_TOKEN=<token with read:packages> before `docker compose build` / `up --build`.
  npm_token:
    environment: NODE_AUTH_TOKEN

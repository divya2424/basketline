[project]
name = "event-pipeline"
version = "0.1.0"
description = "Kafka (analytics.<eventName>.v1) → PySpark Structured Streaming → ClickHouse"
requires-python = ">=3.10,<3.13"
# pyspark is provided by the Spark runtime (spark-submit), so it is only a dev dependency.
dependencies = [
  "clickhouse-connect==1.10.0",
  "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
  "pyspark==4.0.4",
  "pytest==9.1.1",
  "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

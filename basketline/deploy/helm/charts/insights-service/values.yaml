image:
  repository: basketline/insights-service
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2
port: 4005

config:
  NODE_ENV: production
  LOG_LEVEL: info

# The chart stores these in a Secret. Or set existingSecret to a Secret you manage with the same keys.
# ClickHouse only, as the tenant-scoped reader (infra/clickhouse/04_access.sql); no Kafka.
secrets:
  # http://basketline_reader:<password>@<host>:8123/analytics
  CLICKHOUSE_READER_URL: ""
existingSecret: ""

# Only the gateway (and Prometheus) may call this service: it trusts the caller the gateway verified
# (x-basketline-caller) instead of verifying tokens again, so it mounts no token keys.
networkPolicy:
  enabled: true
  from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: gateway
    # Prometheus, to scrape /metrics (same port as the API). Change the labels to your install's.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

runAsUser: 1000
readOnlyRootFilesystem: true
# More than SHUTDOWN_DRAIN_MS (5 s) + SHUTDOWN_TIMEOUT_MS (25 s).
terminationGracePeriodSeconds: 35

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

  </defs>
  <rect width="1800" height="1290" fill="#ffffff"/>
  <text x="40" y="58" class="title">Basketline — production deployment (AWS)</text>
  <text x="40" y="88" class="sub">One region, three availability zones; every stateful tier replicated across them. Sized for 100k events/s from the load-test capacity model (basketline/loadtest/README.md).</text>
  <text x="40" y="150" class="zone" fill="#64748b">CLIENTS</text>
  <rect x="30" y="165" width="230" height="130" rx="14" class="client"/>
  <text x="46" y="193" class="head">Shoppers</text>
  <text x="46" y="217" class="body">Retailer sites and apps</text>
  <text x="46" y="237" class="body">SDK → /analytics/events</text>
  <rect x="30" y="315" width="230" height="130" rx="14" class="client"/>
  <text x="46" y="343" class="head">Retailer backends</text>
  <text x="46" y="367" class="body">Catalog, campaigns, identity</text>
  <text x="46" y="387" class="body">SDK /server → /retail/*</text>
  <rect x="30" y="465" width="230" height="130" rx="14" class="client"/>
  <text x="46" y="493" class="head">Marketers</text>
  <text x="46" y="517" class="body">Dashboard (React SPA)</text>
  <text x="46" y="537" class="body">GET /ad/*</text>
  <text x="300" y="150" class="zone" fill="#64748b">ENTRY</text>
  <rect x="290" y="165" width="220" height="100" rx="14" class="infra"/>
  <text x="306" y="193" class="head">Route 53</text>
  <text x="306" y="217" class="body">api. and app. domains</text>
  <rect x="290" y="285" width="220" height="110" rx="14" class="infra"/>
  <text x="306" y="313" class="head">CloudFront</text>
  <text x="306" y="337" class="body">Dashboard SPA from S3</text>
  <text x="306" y="357" class="body">cached at the edge</text>
  <rect x="290" y="415" width="220" height="180" rx="14" class="infra"/>
  <text x="306" y="443" class="head">ALB + AWS WAF</text>
  <text x="306" y="467" class="body">TLS, over 3 AZs</text>
  <text x="306" y="487" class="body">WAF: bot and IP rules,</text>
  <text x="306" y="507" class="body">rate-based limits</text>
  <text x="306" y="527" class="body">Only /api reaches</text>
  <text x="306" y="547" class="body">the cluster</text>
  <rect x="540" y="120" width="1240" height="880" rx="20" class="region"/>
  <text x="560" y="150" class="zone" fill="#0f766e">AWS REGION · VPC · PRIVATE SUBNETS IN AZ a, b, c</text>
  <rect x="555" y="165" width="815" height="820" rx="16" class="pool"/>
  <text x="575" y="192" class="zone" fill="#2563eb">AMAZON EKS · one Helm release per service (helmfile)</text>
  <rect x="570" y="205" width="785" height="185" rx="12" class="pool"/>
  <text x="585" y="228" class="small">Edge node pool · stateless · HPA on CPU · spread over AZs · PodDisruptionBudgets</text>
  <rect x="585" y="240" width="180" height="135" rx="14" class="svc"/>
  <text x="601" y="268" class="head">gateway</text>
  <text x="601" y="292" class="body">3 → ~60 pods</text>
  <text x="601" y="312" class="body">tokens, per-IP limits</text>
  <text x="601" y="332" class="body">/metrics blocked</text>
  <rect x="777" y="240" width="180" height="135" rx="14" class="svc"/>
  <text x="793" y="268" class="head">ingestion-service</text>
  <text x="793" y="292" class="body">3 → ~60 pods</text>
  <text x="793" y="312" class="body">events, /retail/*</text>
  <text x="793" y="332" class="body">tenant budget by tier</text>
  <rect x="969" y="240" width="180" height="135" rx="14" class="svc"/>
  <text x="985" y="268" class="head">insights-service</text>
  <text x="985" y="292" class="body">3 → 20 pods</text>
  <text x="985" y="312" class="body">/ad, reader user only</text>
  <text x="985" y="332" class="body">no Kafka, no writes</text>
  <rect x="1161" y="240" width="180" height="135" rx="14" class="svc"/>
  <text x="1177" y="268" class="head">auth-service</text>
  <text x="1177" y="292" class="body">3 → 10 pods</text>
  <text x="1177" y="312" class="body">keys, tokens, users</text>
  <text x="1177" y="332" class="body">Postgres via RDS</text>
  <rect x="570" y="405" width="785" height="185" rx="12" class="pool"/>
  <text x="585" y="428" class="small">Stream node pool · Flink Kubernetes Operator · local NVMe for RocksDB state</text>
  <rect x="585" y="440" width="200" height="135" rx="14" class="proc"/>
  <text x="601" y="468" class="head">JobManager × 2</text>
  <text x="601" y="492" class="body">HA leader election</text>
  <text x="601" y="512" class="body">AZ a and b</text>
  <text x="601" y="532" class="body">upgrade: last-state</text>
  <rect x="800" y="440" width="290" height="135" rx="14" class="proc"/>
  <text x="816" y="468" class="head">TaskManagers</text>
  <text x="816" y="492" class="body">parallelism 48 (= partitions)</text>
  <text x="816" y="511" class="body">attribution join, sessions</text>
  <text x="816" y="530" class="body">autoscaler on Kafka lag</text>
  <text x="816" y="549" class="body">checkpoints → S3 every minute</text>
  <rect x="1105" y="440" width="235" height="135" rx="14" class="archive"/>
  <text x="1121" y="468" class="head">Kafka Connect</text>
  <text x="1121" y="492" class="body">Iceberg sink, 3+ workers</text>
  <text x="1121" y="512" class="body">a task per partition</text>
  <text x="1121" y="532" class="body">or Amazon MSK Connect</text>
  <rect x="570" y="605" width="785" height="185" rx="12" class="pool"/>
  <text x="585" y="628" class="small">ClickHouse node pool · Altinity operator (or ClickHouse Cloud) · gp3 disks</text>
  <rect x="585" y="640" width="245" height="135" rx="14" class="db"/>
  <text x="601" y="668" class="head">Shard 1</text>
  <text x="601" y="692" class="body">replica AZ a · replica AZ b</text>
  <text x="601" y="711" class="body">tenants by cityHash64(tenant)</text>
  <text x="601" y="730" class="body">Kafka engine consumers</text>
  <rect x="845" y="640" width="245" height="135" rx="14" class="db"/>
  <text x="861" y="668" class="head">Shard 2</text>
  <text x="861" y="692" class="body">replica AZ b · replica AZ c</text>
  <text x="861" y="711" class="body">Distributed tables on top</text>
  <text x="861" y="730" class="body">(+ a shard for a huge tenant)</text>
  <rect x="1105" y="640" width="235" height="135" rx="14" class="db"/>
  <text x="1121" y="668" class="head">ClickHouse Keeper × 3</text>
  <text x="1121" y="692" class="body">one per AZ</text>
  <text x="1121" y="711" class="body">replication; the hourly</text>
  <text x="1121" y="730" class="body">check runs once per shard</text>
  <rect x="570" y="805" width="785" height="165" rx="12" class="pool"/>
  <text x="585" y="828" class="small">Ops node pool</text>
  <rect x="585" y="840" width="370" height="115" rx="14" class="ops"/>
  <text x="601" y="868" class="head">Airflow</text>
  <text x="601" y="892" class="body">KubernetesExecutor: a pod per task</text>
  <text x="601" y="912" class="body">history_backfill · backups · lake purges</text>
  <rect x="970" y="840" width="370" height="115" rx="14" class="ops"/>
  <text x="986" y="868" class="head">Prometheus · Grafana · Loki</text>
  <text x="986" y="892" class="body">every pod's /metrics, MSK, Flink, ClickHouse</text>
  <text x="986" y="912" class="body">Alertmanager → pager</text>
  <rect x="1390" y="165" width="375" height="230" rx="14" class="kafka"/>
  <text x="1406" y="193" class="head">Amazon MSK (Kafka)</text>
  <text x="1406" y="217" class="body">3+ brokers, one per AZ · RF 3 · min ISR 2</text>
  <text x="1406" y="237" class="body">retail.interactions.v1: 48 partitions</text>
  <text x="1406" y="257" class="small">  keyed by event ID · 14 days</text>
  <text x="1406" y="277" class="body">identity events · 14 days</text>
  <text x="1406" y="297" class="body">catalog, campaign, campaign-products,</text>
  <text x="1406" y="317" class="body">tenant topics: compacted</text>
  <text x="1406" y="337" class="body">serving.*: 48 hours · IAM auth, TLS</text>
  <rect x="1390" y="415" width="375" height="230" rx="14" class="archive"/>
  <text x="1406" y="443" class="head">Amazon S3 + Glue + Athena</text>
  <text x="1406" y="467" class="body">lake/: Iceberg tables, every topic,</text>
  <text x="1406" y="487" class="small">  partitioned by tenant and hour</text>
  <text x="1406" y="507" class="small">  Standard → IA (30 d) → Glacier IR (180 d)</text>
  <text x="1406" y="527" class="body">clickhouse-backups/ · 35 days</text>
  <text x="1406" y="547" class="body">flink-checkpoints/</text>
  <text x="1406" y="567" class="body">Glue Data Catalog · Athena · SSE-KMS</text>
  <rect x="1390" y="665" width="375" height="115" rx="14" class="db"/>
  <text x="1406" y="693" class="head">Amazon RDS for PostgreSQL</text>
  <text x="1406" y="717" class="body">Multi-AZ · a database and login per service</text>
  <text x="1406" y="737" class="body">identity, airflow · point-in-time recovery</text>
  <rect x="1390" y="800" width="375" height="185" rx="14" class="infra"/>
  <text x="1406" y="828" class="head">Security</text>
  <text x="1406" y="852" class="body">Secrets Manager → External Secrets</text>
  <text x="1406" y="872" class="body">KMS keys: S3, MSK, RDS, EBS</text>
  <text x="1406" y="892" class="body">IRSA: one IAM role per service account</text>
  <text x="1406" y="912" class="body">JWT signing key: auth-service only</text>
  <text x="1406" y="932" class="body">Private subnets; NAT for egress only</text>
  <path d="M260,230 H288" class="arrow"/>
  <path d="M260,530 H288" class="arrow"/>
  <path d="M260,380 L288,470" class="arrow"/>
  <path d="M510,500 H583" class="live"/>
  <text x="520" y="490" class="lbl">/api</text>
  <path d="M1356,300 H1388" class="live"/>
  <path d="M1388,355 H1372 V403" class="live"/>
  <path d="M1342,505 H1388" class="batch"/>
  <path d="M1388,385 H1380 V700 H1358" class="live"/>
  <text x="40" y="1040" class="zone" fill="#64748b">CI / CD</text>
  <rect x="30" y="1055" width="330" height="85" rx="14" class="infra"/>
  <text x="46" y="1083" class="head">GitHub pull request</text>
  <text x="46" y="1107" class="body">ci: lint, typecheck, tests, e2e</text>
  <rect x="380" y="1055" width="330" height="85" rx="14" class="infra"/>
  <text x="396" y="1083" class="head">GitHub Actions (main)</text>
  <text x="396" y="1107" class="body">one image per service</text>
  <path d="M360,1097 H378" class="arrow"/>
  <rect x="730" y="1055" width="330" height="85" rx="14" class="infra"/>
  <text x="746" y="1083" class="head">Amazon ECR</text>
  <text x="746" y="1107" class="body">immutable tags, scanning</text>
  <path d="M710,1097 H728" class="arrow"/>
  <rect x="1080" y="1055" width="330" height="85" rx="14" class="infra"/>
  <text x="1096" y="1083" class="head">helmfile apply (or Argo CD)</text>
  <text x="1096" y="1107" class="body">one service at a time, rollback</text>
  <path d="M1060,1097 H1078" class="arrow"/>
  <rect x="1430" y="1055" width="330" height="85" rx="14" class="infra"/>
  <text x="1446" y="1083" class="head">GitHub Packages</text>
  <text x="1446" y="1107" class="body">SDK and Kafka library</text>
  <path d="M1410,1097 H1428" class="arrow"/>
  <text x="40" y="1180" class="small">Sizing for 100k events/s (≈11k requests/s at 9 events each; measured ~250 requests/s per 1-vCPU Node pod): ~60 gateway and ~60 ingestion pods with headroom ·</text>
  <text x="40" y="1200" class="small">MSK 3+ brokers, 48 partitions (~100 MB/s) · Flink parallelism 48 · ClickHouse 2 shards × 2 replicas; /ad reads are daily rows, bounded to 10 s and 4 threads.</text>
  <text x="40" y="1220" class="small">A heavy tenant is capped by its tier's budget at ingestion (429 + Retry-After); its events spread over all partitions and Flink tasks; the largest can get their own shard.</text>
  <text x="40" y="1240" class="small">Laptop-based figures are a first estimate: re-measure on the target instances before committing to node counts.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1110" viewBox="0 0 1800 1110" role="img" aria-labelledby="title desc">
  <title id="title">Basketline platform architecture</title>
  <desc id="desc">Logical architecture. Retailers' sites and backends send events and reference data to Basketline's gateway and ingestion-service, which publish to Kafka. Flink computes ad events, click-to-basket attribution and user sessions into serving topics that ClickHouse aggregates per tenant, store, campaign and day; insights-service serves the /ad API from them. Kafka Connect writes every topic to Iceberg tables on S3, the system of record, from which Airflow's history backfill recomputes ClickHouse's daily tables.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .title{font-size:34px;font-weight:750}.sub{font-size:16px;fill:#475569}
      .zone{font-size:15px;font-weight:700;letter-spacing:.06em}
      .head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#334155}.small{font-size:12px;fill:#475569}
      .tag{font-size:12px;font-weight:700;fill:#1d4ed8}
      .infra{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.svc{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}
      .kafka{fill:#fff7ed;stroke:#fb923c;stroke-width:2}.proc{fill:#f5f3ff;stroke:#a78bfa;stroke-width:2}
      .db{fill:#ecfdf5;stroke:#34d399;stroke-width:2}.archive{fill:#f0fdfa;stroke:#2dd4bf;stroke-width:2}
      .ops{fill:#fdf2f8;stroke:#f472b6;stroke-width:2}.client{fill:#ffffff;stroke:#94a3b8;stroke-width:2}
      .retailer{fill:#fafafa;stroke:#94a3b8;stroke-width:2;stroke-dasharray:9 7}
      .platform{fill:#f8fbff;stroke:#2563eb;stroke-width:3}
      .region{fill:#fbfdff;stroke:#0f766e;stroke-width:2.5;stroke-dasharray:10 6}
      .pool{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .arrow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}
      .live{fill:none;stroke:#2563eb;stroke-width:2.6;marker-end:url(#arrowBlue)}
      .batch{fill:none;stroke:#0d9488;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrowTeal)}
      .ref{fill:none;stroke:#ea580c;stroke-width:2.2;marker-end:url(#arrowOrange)}
      .lbl{font-size:12px;fill:#334155}
    </style>
  </defs>
  <rect width="1800" height="1110" fill="#ffffff"/>
  <text x="40" y="58" class="title">Basketline — platform architecture</text>
  <text x="40" y="88" class="sub">The platform starts where events and reference data are ingested. Left of the dashed line: the retailer's own systems (simulated in retailer-sim/).</text>
  <rect x="30" y="120" width="300" height="590" rx="20" class="retailer"/>
  <text x="50" y="150" class="zone" fill="#64748b">RETAILER SYSTEMS</text>
  <rect x="50" y="170" width="260" height="150" rx="14" class="client"/>
  <text x="66" y="198" class="head">Storefront and apps</text>
  <text x="66" y="222" class="body">Basketline SDK: track()</text>
  <text x="66" y="242" class="body">Visitor and shopper tokens</text>
  <text x="66" y="262" class="body">Events in batches of 1–100</text>
  <text x="66" y="282" class="small">  impressions, clicks, views, cart</text>
  <rect x="50" y="350" width="260" height="170" rx="14" class="client"/>
  <text x="66" y="378" class="head">Retailer backend</text>
  <text x="66" y="402" class="body">Catalog, stores, campaigns</text>
  <text x="66" y="422" class="body">and their products</text>
  <text x="66" y="442" class="body">Full state to /retail/*</text>
  <text x="66" y="462" class="body">with an integration token</text>
  <text x="66" y="482" class="body">Erasure: user_deleted</text>
  <rect x="50" y="550" width="260" height="130" rx="14" class="client"/>
  <text x="66" y="578" class="head">Marketers</text>
  <text x="66" y="602" class="body">Campaign managers</text>
  <text x="66" y="622" class="body">Dashboard (React SPA)</text>
  <text x="66" y="642" class="body">GET /ad/* through the gateway</text>
  <rect x="350" y="120" width="1430" height="860" rx="22" class="platform"/>
  <text x="370" y="142" class="zone" fill="#2563eb">BASKETLINE PLATFORM</text>
  <text x="380" y="168" class="zone" fill="#2563eb">EDGE</text>
  <rect x="380" y="175" width="220" height="150" rx="14" class="svc"/>
  <text x="396" y="203" class="head">Gateway</text>
  <text x="396" y="227" class="body">Token check, routing</text>
  <text x="396" y="247" class="body">CORS per tenant's origins</text>
  <text x="396" y="267" class="body">Per-IP rate limits</text>
  <text x="396" y="287" class="body">Stateless, autoscaled</text>
  <rect x="380" y="350" width="220" height="170" rx="14" class="svc"/>
  <text x="396" y="378" class="head">auth-service</text>
  <text x="396" y="402" class="body">Tenants, API keys</text>
  <text x="396" y="422" class="body">Visitor, shopper,</text>
  <text x="396" y="442" class="body">integration tokens</text>
  <text x="396" y="462" class="body">Dashboard users, roles</text>
  <text x="396" y="482" class="body">Postgres identity_db</text>
  <text x="630" y="168" class="zone" fill="#2563eb">INGESTION</text>
  <rect x="630" y="175" width="250" height="190" rx="14" class="svc"/>
  <text x="646" y="203" class="head">ingestion-service</text>
  <text x="646" y="227" class="body">POST /analytics/events</text>
  <text x="646" y="247" class="body">Validate, refuse bots</text>
  <text x="646" y="267" class="body">Active campaign of the tenant</text>
  <text x="646" y="287" class="body">Budget per sender and tenant</text>
  <text x="646" y="307" class="body">tier → 429 + Retry-After</text>
  <text x="646" y="327" class="body">Stateless, autoscaled</text>
  <rect x="630" y="390" width="250" height="130" rx="14" class="svc"/>
  <text x="646" y="418" class="head">Retail API</text>
  <text x="646" y="442" class="body">ingestion-service · /retail/*</text>
  <text x="646" y="462" class="body">Catalog, campaigns, stores,</text>
  <text x="646" y="482" class="body">campaign products, identity</text>
  <text x="910" y="168" class="zone" fill="#ea580c">STREAM</text>
  <rect x="910" y="175" width="270" height="345" rx="14" class="kafka"/>
  <text x="926" y="203" class="head">Kafka (all tenants)</text>
  <text x="926" y="227" class="body">retail.interactions.v1</text>
  <text x="926" y="247" class="small">  keyed by event ID · 14 days</text>
  <text x="926" y="267" class="body">retail.identity-events.v1 · 14 d</text>
  <text x="926" y="287" class="body">catalog, campaign, campaign-</text>
  <text x="926" y="307" class="body">products, tenant topics</text>
  <text x="926" y="327" class="small">  compacted: latest state per ID</text>
  <text x="926" y="347" class="body">serving.events.v1</text>
  <text x="926" y="367" class="body">serving.attributed_baskets.v1</text>
  <text x="926" y="387" class="body">serving.sessions.v1</text>
  <text x="926" y="407" class="small">  48 hours</text>
  <text x="1210" y="168" class="zone" fill="#7c3aed">PROCESSING</text>
  <rect x="1210" y="175" width="270" height="345" rx="14" class="proc"/>
  <text x="1226" y="203" class="head">Flink SQL (one job)</text>
  <text x="1226" y="227" class="body">Ad events: validate, project</text>
  <text x="1226" y="247" class="body"></text>
  <text x="1226" y="267" class="body">Click → basket attribution</text>
  <text x="1226" y="287" class="small">  regular join, keyed by</text>
  <text x="1226" y="307" class="small">  (tenant, user, product), 7 days</text>
  <text x="1226" y="327" class="body"></text>
  <text x="1226" y="347" class="body">User sessions</text>
  <text x="1226" y="367" class="small">  event-time window, keyed by</text>
  <text x="1226" y="387" class="small">  (tenant, user), 30-min gap</text>
  <text x="1226" y="407" class="body"></text>
  <text x="1226" y="427" class="body">RocksDB state, checkpoints</text>
  <text x="1510" y="168" class="zone" fill="#059669">SERVING</text>
  <rect x="1510" y="175" width="250" height="200" rx="14" class="db"/>
  <text x="1526" y="203" class="head">ClickHouse</text>
  <text x="1526" y="227" class="body">Staging: Flink's output, 3 days</text>
  <text x="1526" y="247" class="body">Daily tables per tenant, store,</text>
  <text x="1526" y="267" class="body">campaign, day: kept forever</text>
  <text x="1526" y="287" class="body">Live views + hourly recount</text>
  <text x="1526" y="307" class="body">Row policy: one tenant per</text>
  <text x="1526" y="327" class="body">query for the reader</text>
  <rect x="1510" y="395" width="250" height="125" rx="14" class="svc"/>
  <text x="1526" y="423" class="head">insights-service</text>
  <text x="1526" y="447" class="body">GET /ad/{campaign}/{metric}</text>
  <text x="1526" y="467" class="body">clicks · impressions ·</text>
  <text x="1526" y="487" class="body">clickToBasket · sessions</text>
  <text x="910" y="600" class="zone" fill="#0d9488">DATA LAKE AND BATCH</text>
  <rect x="910" y="615" width="270" height="165" rx="14" class="archive"/>
  <text x="926" y="643" class="head">Kafka Connect</text>
  <text x="926" y="667" class="body">Iceberg sink: every topic</text>
  <text x="926" y="687" class="body">Payload flattened into</text>
  <text x="926" y="707" class="body">typed, evolving columns</text>
  <text x="926" y="727" class="body">Commits hourly</text>
  <rect x="1210" y="615" width="270" height="165" rx="14" class="archive"/>
  <text x="1226" y="643" class="head">Iceberg on S3 (the lake)</text>
  <text x="1226" y="667" class="body">Every event, every tenant</text>
  <text x="1226" y="687" class="body">Partitioned by tenant, hour</text>
  <text x="1226" y="707" class="body">Kept forever, tiered storage</text>
  <text x="1226" y="727" class="body">Athena · Trino · Snowflake</text>
  <rect x="1510" y="615" width="250" height="165" rx="14" class="ops"/>
  <text x="1526" y="643" class="head">Airflow</text>
  <text x="1526" y="667" class="body">history_backfill: lake →</text>
  <text x="1526" y="687" class="small">  ClickHouse daily tables</text>
  <text x="1526" y="707" class="body">Daily ClickHouse backups</text>
  <text x="1526" y="727" class="body">Tenant and shopper purges</text>
  <text x="380" y="820" class="zone" fill="#db2777">OBSERVABILITY</text>
  <rect x="380" y="835" width="1380" height="115" rx="14" class="ops"/>
  <text x="396" y="863" class="head">Prometheus · Grafana · Alertmanager · Loki</text>
  <text x="396" y="887" class="body">Services: requests, 5xx, p99, event-loop lag · Kafka consumer lag · Flink uptime, restarts, checkpoints, records/s, late events · ClickHouse</text>
  <text x="396" y="907" class="body">Pipeline health from SQL: newest event age, hourly check, backup age, Kafka engine errors, events per store · logs: Alloy → Loki (profile logs)</text>
  <rect x="380" y="600" width="500" height="180" rx="14" class="infra"/>
  <text x="396" y="628" class="head">Tenant isolation</text>
  <text x="396" y="652" class="body">Tenant comes from the token, never the body</text>
  <text x="396" y="672" class="body">Every row and topic message has tenant_id</text>
  <text x="396" y="692" class="body">ClickHouse row policy for the /ad reader</text>
  <text x="396" y="712" class="body">Lake partitioned by tenant: purge, export</text>
  <text x="396" y="732" class="body">Budgets by tier; per-query read limits</text>
  <path d="M310,245 H378" class="live"/>
  <text x="318" y="236" class="lbl">events</text>
  <path d="M600,250 H628" class="live"/>
  <path d="M490,325 V348" class="arrow"/>
  <path d="M880,250 H908" class="live"/>
  <path d="M1180,250 H1208" class="live"/>
  <path d="M1480,260 H1508" class="live"/>
  <path d="M1635,375 V393" class="arrow"/>
  <path d="M1635,520 V560 H600 V545 H312 V600" class="arrow"/>
  <text x="640" y="552" class="lbl">dashboard reads (through the gateway)</text>
  <path d="M310,420 L378,300" class="ref"/>
  <path d="M600,300 L628,440" class="ref"/>
  <path d="M880,455 H908" class="ref"/>
  <path d="M1150,520 V613" class="batch"/>
  <path d="M1180,700 H1208" class="batch"/>
  <path d="M1480,700 H1508" class="batch"/>
  <path d="M1760,700 H1775 V275 H1762" class="batch"/>
  <path d="M380,1010 H430" class="live"/>
  <text x="442" y="1015" class="body">Live path (seconds)</text>
  <path d="M720,1010 H770" class="ref"/>
  <text x="782" y="1015" class="body">Reference data</text>
  <path d="M1060,1010 H1110" class="batch"/>
  <text x="1122" y="1015" class="body">Lake and batch</text>
  <path d="M1400,1010 H1450" class="arrow"/>
  <text x="1462" y="1015" class="body">Tokens, reads</text>
  <text x="380" y="1060" class="small">Each layer scales out on its own: stateless pods on CPU, Kafka by partitions, Flink by parallelism, ClickHouse by shards. A tenant is capped at its tier's budget at ingestion.</text>
</svg>
